<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />
  <title>旅行足迹 · 朱智繁</title>

  <style>
    :root {
      --tf-bg: #04060d;
      --tf-text: rgba(255, 255, 255, 0.96);
      --tf-muted: rgba(255, 255, 255, 0.58);
      --tf-line: rgba(255, 255, 255, 0.12);
      --tf-glass: rgba(255, 255, 255, 0.07);
      --tf-accent: #f0a24a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    [hidden] {
      display: none !important;
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
    }

    body {
      background:
        radial-gradient(circle at 12% 18%, rgba(240, 162, 74, 0.16), transparent 36%),
        radial-gradient(circle at 84% 10%, rgba(192, 86, 33, 0.14), transparent 32%),
        radial-gradient(circle at 68% 86%, rgba(233, 162, 59, 0.10), transparent 30%),
        var(--tf-bg);

      color: var(--tf-text);

      font-family:
        Inter,
        "PingFang SC",
        "Microsoft YaHei",
        "Segoe UI",
        sans-serif;

      user-select: none;
      -webkit-user-select: none;
    }

    .tf-grid {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: 0.30;

      background-image:
        linear-gradient(rgba(255, 255, 255, 0.055) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.055) 1px, transparent 1px);

      background-size: 52px 52px;

      -webkit-mask-image: radial-gradient(circle at center, black 0%, transparent 90%);
      mask-image: radial-gradient(circle at center, black 0%, transparent 90%);
    }

    .tf-vignette {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;

      background: radial-gradient(
        circle at center,
        transparent 42%,
        rgba(0, 0, 0, 0.44) 100%
      );
    }

    #tfViewport {
      position: fixed;
      inset: 0;
      z-index: 1;

      cursor: grab;
      touch-action: none;
    }

    #tfViewport.is-dragging {
      cursor: grabbing;
    }

    .tf-tile {
      position: absolute;
      left: 0;
      top: 0;

      overflow: hidden;

      border-radius: 22px;

      background: linear-gradient(180deg, rgba(255, 255, 255, 0.09), rgba(255, 255, 255, 0.045));
      border: 1px solid rgba(255, 255, 255, 0.11);

      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.36);

      pointer-events: auto;
      cursor: zoom-in;

      will-change: transform;

      transition: border-color 0.35s ease, box-shadow 0.35s ease;
    }

    .tf-tile:hover {
      border-color: rgba(240, 162, 74, 0.30);

      box-shadow:
        0 24px 70px rgba(0, 0, 0, 0.44),
        0 0 40px rgba(240, 162, 74, 0.12);
    }

    .tf-tile::after {
      content: "";
      position: absolute;
      inset: 0;

      background: linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.14),
        transparent 22%,
        transparent 78%,
        rgba(0, 0, 0, 0.18)
      );

      opacity: 0.38;
      pointer-events: none;
    }

    .tf-tile img {
      width: 100%;
      height: 100%;

      object-fit: cover;
      display: block;

      opacity: 0;
      pointer-events: none;

      transition: opacity 0.7s ease, transform 0.75s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .tf-tile:hover img {
      transform: scale(1.06);
    }

    .tf-tile img.is-ready {
      opacity: 1;
    }

    .tf-placeholder {
      display: grid;
      place-items: center;
      padding: 18px;
      text-align: center;
    }

    .tf-placeholder span {
      font-size: 12px;
      line-height: 1.8;
      color: rgba(255, 255, 255, 0.68);
      letter-spacing: 0.08em;
    }

    .tf-topbar {
      position: fixed;
      inset: 18px 18px auto;
      z-index: 20;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;

      pointer-events: none;
    }

    .tf-topbar > * {
      pointer-events: auto;
    }

    .tf-back-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;

      padding: 12px 16px;
      border-radius: 16px;

      color: var(--tf-text);
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;

      background: var(--tf-glass);
      border: 1px solid var(--tf-line);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.22);

      transition: transform 0.3s ease, border-color 0.3s ease, background 0.3s ease;
    }

    .tf-back-btn:hover {
      transform: translateY(-2px);
      border-color: rgba(240, 162, 74, 0.28);
      background: rgba(255, 255, 255, 0.11);
    }

    .tf-badge {
      padding: 12px 16px;
      border-radius: 16px;
      text-align: right;

      background: var(--tf-glass);
      border: 1px solid var(--tf-line);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.22);
    }

    .tf-badge strong {
      font-size: 14px;
      letter-spacing: 0.06em;
    }

    .tf-badge span {
      display: block;
      margin-top: 3px;

      font-size: 10px;
      color: var(--tf-muted);
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    .tf-hint {
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%);

      z-index: 20;
      pointer-events: none;
      white-space: nowrap;

      padding: 11px 16px;
      border-radius: 999px;

      background: rgba(5, 8, 16, 0.62);
      border: 1px solid rgba(255, 255, 255, 0.12);

      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);

      color: rgba(255, 255, 255, 0.72);
      font-size: 13px;

      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    .tf-hint.is-hidden {
      opacity: 0;
      transform: translateX(-50%) translateY(8px);
    }

    .tf-lightbox {
      position: fixed;
      inset: 0;
      z-index: 80;

      display: grid;
      place-items: center;

      opacity: 0;
      pointer-events: none;

      transition: opacity 0.32s ease;
    }

    .tf-lightbox.is-open {
      opacity: 1;
      pointer-events: auto;
    }

    .tf-lightbox__backdrop {
      position: absolute;
      inset: 0;

      background: rgba(2, 5, 10, 0.74);

      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
    }

    .tf-lightbox__panel {
      position: relative;
      z-index: 1;

      width: min(1120px, calc(100vw - 28px));
      height: min(82vh, 860px);

      display: grid;
      grid-template-columns: minmax(0, 1.4fr) minmax(280px, 0.6fr);

      overflow: hidden;

      border-radius: 30px;

      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.10), rgba(255, 255, 255, 0.05)),
        rgba(7, 10, 20, 0.58);

      border: 1px solid rgba(255, 255, 255, 0.14);

      box-shadow: 0 40px 120px rgba(0, 0, 0, 0.5);

      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);

      transform: translateY(14px) scale(0.985);

      transition: transform 0.32s ease;
    }

    .tf-lightbox.is-open .tf-lightbox__panel {
      transform: none;
    }

    .tf-lightbox__media {
      position: relative;

      min-height: 0;

      display: grid;
      place-items: center;

      background: rgba(0, 0, 0, 0.32);
    }

    .tf-lightbox__img {
      width: 100%;
      height: 100%;

      object-fit: contain;
      display: block;

      opacity: 0;

      transition: opacity 0.35s ease;
    }

    .tf-lightbox__img.is-ready {
      opacity: 1;
    }

    .tf-lightbox__info {
      min-height: 0;
      overflow: auto;

      padding: 28px;

      display: flex;
      flex-direction: column;
      gap: 16px;

      border-left: 1px solid rgba(255, 255, 255, 0.08);

      background: linear-gradient(180deg, transparent, rgba(255, 255, 255, 0.03));
    }

    .tf-lightbox__count {
      font-size: 12px;
      letter-spacing: 0.18em;
      color: rgba(255, 255, 255, 0.48);
      text-transform: uppercase;
    }

    .tf-lightbox__title {
      font-size: 28px;
      font-weight: 900;
      line-height: 1.25;
    }

    .tf-lightbox__meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tf-chip {
      padding: 8px 11px;

      border-radius: 999px;

      font-size: 12px;
      color: rgba(255, 255, 255, 0.76);

      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.10);
    }

    .tf-lightbox__story {
      font-size: 15px;
      line-height: 1.9;
      color: rgba(255, 255, 255, 0.74);

      white-space: pre-wrap;
    }

    .tf-lightbox__close,
    .tf-lightbox__nav {
      position: absolute;
      z-index: 5;

      width: 48px;
      height: 48px;

      display: grid;
      place-items: center;

      border-radius: 16px;

      color: #fff;

      background: rgba(255, 255, 255, 0.09);
      border: 1px solid rgba(255, 255, 255, 0.14);

      cursor: pointer;

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      transition: background 0.3s ease, border-color 0.3s ease, transform 0.3s ease;
    }

    .tf-lightbox__close:hover,
    .tf-lightbox__nav:hover {
      background: rgba(255, 255, 255, 0.16);
      border-color: rgba(255, 255, 255, 0.22);
    }

    .tf-lightbox__close {
      top: 18px;
      right: 18px;
    }

    .tf-lightbox__prev {
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
    }

    .tf-lightbox__next {
      right: 18px;
      top: 50%;
      transform: translateY(-50%);
    }

    .tf-lightbox__prev:hover {
      transform: translateY(-50%) translateX(-2px);
    }

    .tf-lightbox__next:hover {
      transform: translateY(-50%) translateX(2px);
    }

    @media (max-width: 860px) {
      .tf-lightbox__panel {
        grid-template-columns: 1fr;
        grid-template-rows: minmax(0, 52%) auto;

        height: min(88vh, 900px);
      }

      .tf-lightbox__info {
        border-left: none;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
      }

      .tf-lightbox__title {
        font-size: 22px;
      }

      .tf-lightbox__prev,
      .tf-lightbox__next {
        top: auto;
        bottom: 18px;
        transform: none;
      }
    }

    @media (max-width: 640px) {
      .tf-topbar {
        inset: 12px;
      }

      .tf-badge {
        display: none;
      }

      .tf-hint {
        width: calc(100vw - 28px);
        text-align: center;
        white-space: normal;
      }
    }
  </style>
</head>

<body>
  <div class="tf-grid" aria-hidden="true"></div>

  <div id="tfViewport" aria-label="旅行足迹无限画布"></div>

  <div class="tf-vignette" aria-hidden="true"></div>

  <header class="tf-topbar">

      <figcaption class="tf-lightbox__info">

        <div class="tf-lightbox__title" id="tfLightboxTitle"></div>

        <div class="tf-lightbox__meta">
          <span class="tf-chip" id="tfLightboxLocation" hidden></span>

        <p class="tf-lightbox__story" id="tfLightboxStory" hidden></p>

  </div>

  <script>
      window.addEventListener("error", (e) => {
        // debug removed
      });
      window.addEventListener("unhandledrejection", (e) => {
        // debug removed
      });
    /* ==========================================================
       当前项目图片就在网站根目录，文件名如下。
       如果以后你想给每张照片加地点 / 时间 / 故事，
       可以把字符串改成对象：

       {
         src: "旅行.jpg",
         title: "标题",
         location: "地点",
         date: "2025-01-01",
         story: "故事内容"
       }
    ========================================================== */

    const IMAGE_FOLDER = "";

    const TRAVEL_PHOTOS = [
      "旅行.jpg",
      "旅行 (2).jpg",
      "旅行 (3).jpg",
      "旅行 (4).jpg",
      "旅行 (5).jpg",
      "旅行 (6).jpg",
      "旅行 (7).jpg",
      "旅行 (8).jpg",
      "旅行 (9).jpg",
      "旅行 (10).jpg",
      "旅行 (11).jpg",
      "旅行 (12).jpg",
      "旅行 (13).jpg",
      "旅行 (14).jpg",
        "旅行 (15).jpg",
        "旅行 (16).jpg",
        "旅行 (17).jpg",
        "旅行 (18).jpg",
        "旅行 (19).jpg",
        "旅行 (20).jpg",
        "旅行 (21).jpg",
        "旅行 (22).jpg",
        "旅行 (23).jpg",
    ].map((src, index) => ({
      src,
      title: `旅行足迹 · ${String(index + 1).padStart(2, "0")}`,
      location: "",
      date: "",
      story: "",
    }));

    const OPTIONAL_IMAGE_JSON = "./travel-images.json";
    const TRY_DIRECTORY_LISTING = false;
    const USE_DEMO_IMAGES_WHEN_EMPTY = false;

  /* 返回个人特质：优先回到上一页（从 index 进入时最稳定，不受部署目录影响），
     没有来源时再使用默认的 index.html#traits 相对链接 */
  (function () {
    const backBtn = document.querySelector(".tf-back-btn");
    if (!backBtn) return;

    backBtn.addEventListener("click", (e) => {
      if (!document.referrer) return;

      e.preventDefault();

      // 普通同标签页进入：直接返回上一页最稳，不受部署目录影响
      if (history.length > 1) {
        history.back();
        return;
      }

      // 新标签页/无历史记录：回到来源的 index 页，并尽量带上 #traits
      try {
        const url = new URL(document.referrer);
        const path = url.pathname;
        const looksLikeIndex =
          path === "/" ||
          path.endsWith("/") ||
          /\/index(\.html?)?$/i.test(path);
        if (looksLikeIndex) {
          if (!url.hash) url.hash = "traits";
          location.href = url.href;
          return;
        }
      } catch (err) {}

      // 兜底：使用默认相对链接
      location.href = "index.html#traits";
    });
  })();


    (() => {
      const viewport = document.getElementById("tfViewport");
      const hint = document.getElementById("tfHint");

      const lightbox = document.getElementById("tfLightbox");
      const lightboxImg = document.getElementById("tfLightboxImg");
      const lightboxTitle = document.getElementById("tfLightboxTitle");
      const lightboxLocation = document.getElementById("tfLightboxLocation");
      const lightboxDate = document.getElementById("tfLightboxDate");
      const lightboxStory = document.getElementById("tfLightboxStory");
      const lightboxCount = document.getElementById("tfLightboxCount");
      const lightboxPrev = document.getElementById("tfLightboxPrev");
      const lightboxNext = document.getElementById("tfLightboxNext");

      let photos = [];
      let metrics = computeMetrics();
      let tiles = new Map();

      let offsetX = 0;
      let offsetY = 0;

      let dragging = false;

      let lastX = 0;
      let lastY = 0;
      let lastTime = 0;

      let downX = 0;
      let downY = 0;
      let downTile = null;
      let moved = false;

      let velocityX = 0;
      let velocityY = 0;

      let renderFrame = 0;
      let inertiaFrame = 0;

      let lightboxOpen = false;
      let currentPhotoIndex = 0;

      init();

        // 调试接口已移除

      async function init() {
        photos = normalizePhotos(TRAVEL_PHOTOS);

        if (!photos.length) {
          photos = await loadFromJson();
        }

        bindLightboxEvents();
        bindPointer();
        bindWheel();
        bindKeyboard();

        render();

        window.addEventListener("resize", onResize);

        setTimeout(() => {
          hint && hint.classList.add("is-hidden");
        }, 5600);
      }

      function normalizePhotos(list) {
        return (Array.isArray(list) ? list : [])
          .filter(Boolean)
          .map((item) => {
            if (typeof item === "string") {
              const src = normalizeSrc(item);

              if (!src) return null;

              return {
                src,
                title: titleFromSrc(src),
                location: "",
                date: "",
                story: "",
              };
            }

            if (typeof item === "object") {
              const src = normalizeSrc(
                item.src || item.url || item.image || ""
              );

              if (!src) return null;

              return {
                src,
                title: item.title || item.name || titleFromSrc(src),
                location: item.location || item.place || item.city || "",
                date: item.date || item.time || item.dateTaken || "",
                story: item.story || item.description || item.text || "",
              };
            }

            return null;
          })
          .filter(Boolean);
      }

      function normalizeSrc(src) {
        if (!src) return "";

        src = String(src).trim();

        if (!src) return "";

        if (/^(https?:\/\/|data:|blob:|\/\/)/i.test(src)) {
          return src;
        }

        if (src.startsWith("/")) {
          return src;
        }

        let clean = src.replace(/^\.\//, "");

        if (IMAGE_FOLDER) {
          if (!clean.startsWith(IMAGE_FOLDER + "/")) {
            clean = `${IMAGE_FOLDER}/${clean}`;
          }
        }

        return encodeURI(clean);
      }

      function titleFromSrc(src) {
        try {
          const name = decodeURIComponent(src.split("/").pop() || "");

          return name.replace(/\.[^.]+$/, "") || "旅行照片";
        } catch {
          return "旅行照片";
        }
      }

      async function loadFromJson() {
        try {
          const res = await fetch(OPTIONAL_IMAGE_JSON, {
            cache: "no-store",
          });

          if (!res.ok) return [];

          const data = await res.json();

          return normalizePhotos(
            Array.isArray(data) ? data : data.images
          );
        } catch {
          return [];
        }
      }

      function computeMetrics() {
        const w = window.innerWidth;
        const h = window.innerHeight;
        const isMobile = w < 700;

        let cellW = Math.round(w / (isMobile ? 2.2 : 4.3));

        cellW = Math.max(cellW, isMobile ? 145 : 205);
        cellW = Math.min(cellW, isMobile ? 240 : 330);

        const ratio = h < 680 ? 1.1 : 1.24;
        const cellH = Math.round(cellW * ratio);

        const gap = isMobile ? 12 : 18;

        return {
          cellW,
          cellH,
          gap,
          stepX: cellW + gap,
          stepY: cellH + gap,
        };
      }

      function hash2D(col, row) {
        let h = Math.imul(col, 374761393) + Math.imul(row, 668265263);
        h = Math.imul(h ^ (h >>> 13), 1274126177);
        h ^= h >>> 16;
        return h >>> 0;
      }

      function photoFor(col, row) {
        if (!photos.length) return null;

        const index = hash2D(col, row) % photos.length;

        return {
          ...photos[index],
          index,
        };
      }

        /* ==========================================================
           相邻 8 格不重复：
           把无限网格按 2x2 奇偶分成 4 种颜色。
           任意上下左右 / 斜向相邻的格子颜色都不同。
           每种颜色使用互不重叠的照片池，因此相邻 8 格不会出现同一张照片。
        ========================================================== */

        var tfColorPools = null;

        function buildColorPools() {
          const pools = [[], [], [], []];

          photos.forEach((photo, index) => {
            pools[index % 4].push(index);
          });

          return pools;
        }

        function cellColor(col, row) {
          const cx = ((col % 2) + 2) % 2;
          const ry = ((row % 2) + 2) % 2;

          return cx + ry * 2;
        }

        function photoFor(col, row) {
          if (!photos.length) return null;

          if (!tfColorPools) {
            tfColorPools = buildColorPools();
          }

          const color = cellColor(col, row);

          let pool = tfColorPools[color];

          if (!pool || !pool.length) {
            const fallbackIndex = hash2D(col, row) % photos.length;

            return {
              ...photos[fallbackIndex],
              index: fallbackIndex,
            };
          }

          const poolIndex = hash2D(col, row) % pool.length;
          const index = pool[poolIndex];

          return {
            ...photos[index],
            index,
          };
        }

      function createTile(col, row) {
        const el = document.createElement("div");

        el.className = "tf-tile";
        el.style.width = `${metrics.cellW}px`;
        el.style.height = `${metrics.cellH}px`;

        el.dataset.col = col;
        el.dataset.row = row;

        const photo = photoFor(col, row);

        if (!photo) {
          setPlaceholder(el, col, row, "旅行照片占位");
          return el;
        }

        const img = new Image();

        img.src = photo.src;
        img.alt = photo.title || "旅行照片";
        img.decoding = "async";
        img.loading = "lazy";
        img.draggable = false;

        img.addEventListener("load", () => {
          img.classList.add("is-ready");
        });

        img.addEventListener("error", () => {
          img.remove();
          setPlaceholder(el, col, row, `${escapeHtml(decodeURIComponent(photo.src))} 未找到`);
        });

        el.appendChild(img);

        return el;
      }

      function setPlaceholder(el, col, row, title) {
        const hue = hash2D(col, row) % 360;

        el.classList.add("tf-placeholder");

        el.style.background = `linear-gradient(
          135deg,
          hsl(${hue} 72% 16%),
          hsl(${(hue + 55) % 360} 78% 29%)
        )`;

        el.innerHTML = `
          <span>
            ${title}<br />
            请检查 travel.html 中的图片路径
          </span>
        `;
      }

      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, (ch) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;",
        }[ch]));
      }

      function render() {
        const { stepX, stepY } = metrics;

        if (Math.abs(offsetX) > 1000000) {
          offsetX = offsetX % stepX;
        }

        if (Math.abs(offsetY) > 1000000) {
          offsetY = offsetY % stepY;
        }

        const marginX = Math.max(stepX * 1.35, 120);
        const marginY = Math.max(stepY * 1.35, 120);

        const minCol = Math.floor((-offsetX - marginX) / stepX);
        const maxCol = Math.ceil(
          (window.innerWidth - offsetX + marginX) / stepX
        );

        const minRow = Math.floor((-offsetY - marginY) / stepY);
        const maxRow = Math.ceil(
          (window.innerHeight - offsetY + marginY) / stepY
        );

        const needed = new Set();

        for (let row = minRow; row <= maxRow; row++) {
          for (let col = minCol; col <= maxCol; col++) {
            const key = `${col}:${row}`;

            needed.add(key);

            let tile = tiles.get(key);

            if (!tile) {
              tile = createTile(col, row);
              tiles.set(key, tile);
              viewport.appendChild(tile);
            }

            const x = Math.round(col * stepX + offsetX);
            const y = Math.round(row * stepY + offsetY);

            tile.style.transform = `translate3d(${x}px, ${y}px, 0)`;
          }
        }

        tiles.forEach((tile, key) => {
          if (!needed.has(key)) {
            tile.remove();
            tiles.delete(key);
          }
        });
      }

      function requestRender() {
        if (renderFrame) return;

        renderFrame = requestAnimationFrame(() => {
          renderFrame = 0;
          render();
        });
      }

      function stopInertia() {
        if (inertiaFrame) cancelAnimationFrame(inertiaFrame);
        inertiaFrame = 0;
      }

      function startInertia() {
        stopInertia();

        const friction = 0.935;

        const step = () => {
          if (Math.abs(velocityX) < 0.25 && Math.abs(velocityY) < 0.25) {
            inertiaFrame = 0;
            return;
          }

          offsetX += velocityX;
          offsetY += velocityY;

          velocityX *= friction;
          velocityY *= friction;

          requestRender();

          inertiaFrame = requestAnimationFrame(step);
        };

        inertiaFrame = requestAnimationFrame(step);
      }

      function bindPointer() {
        viewport.addEventListener("pointerdown", (e) => {
          if (e.pointerType === "mouse" && e.button !== 0) return;

          dragging = true;
          moved = false;

          stopInertia();

          viewport.classList.add("is-dragging");

          try {
            viewport.setPointerCapture(e.pointerId);
          } catch {}

          lastX = e.clientX;
          lastY = e.clientY;
          lastTime = performance.now();

          downX = e.clientX;
          downY = e.clientY;

          downTile = e.target.closest(".tf-tile");

          velocityX = velocityY = 0;

          if (hint) hint.classList.add("is-hidden");
        });

        viewport.addEventListener("pointermove", (e) => {
          if (!dragging || lightboxOpen) return;

          const now = performance.now();

          const dx = e.clientX - lastX;
          const dy = e.clientY - lastY;

          const dt = Math.max(1, now - lastTime);

          velocityX = (dx / dt) * 16;
          velocityY = (dy / dt) * 16;

          lastX = e.clientX;
          lastY = e.clientY;
          lastTime = now;

          offsetX += dx;
          offsetY += dy;

          if (!moved) {
            const distance = Math.hypot(e.clientX - downX, e.clientY - downY);

            if (distance > 7) {
              moved = true;
            }
          }

          requestRender();
        });

        const endDrag = (e) => {
          if (!dragging) return;

          dragging = false;

          viewport.classList.remove("is-dragging");

          try {
            viewport.releasePointerCapture(e.pointerId);
          } catch {}

          if (!moved && downTile && !lightboxOpen) {
            const col = Number(downTile.dataset.col);
            const row = Number(downTile.dataset.row);

            const photo = photoFor(col, row);

            if (photo) {
              openPhoto(photo.index);
            }

            downTile = null;

            return;
          }

          downTile = null;

          startInertia();
        };

        viewport.addEventListener("pointerup", endDrag);
        viewport.addEventListener("pointercancel", endDrag);
      }

      function bindWheel() {
        viewport.addEventListener(
          "wheel",
          (e) => {
            e.preventDefault();

            stopInertia();

            offsetX -= e.deltaX;
            offsetY -= e.deltaY;

            requestRender();

            if (hint) hint.classList.add("is-hidden");
          },
          { passive: false }
        );
      }

      function bindKeyboard() {
        window.addEventListener("keydown", (e) => {
          if (lightboxOpen) {
            if (e.key === "Escape") closePhoto();
            else if (e.key === "ArrowLeft") showPrev();
            else if (e.key === "ArrowRight") showNext();
            else return;

            e.preventDefault();

            return;
          }

          const pan = 130;

          if (e.key === "Escape") {
            window.location.href = "index.html#traits";
            return;
          }

          if (e.key === "ArrowUp") offsetY += pan;
          else if (e.key === "ArrowDown") offsetY -= pan;
          else if (e.key === "ArrowLeft") offsetX += pan;
          else if (e.key === "ArrowRight") offsetX -= pan;
          else return;

          e.preventDefault();

          stopInertia();
          requestRender();
        });
      }

      function bindLightboxEvents() {
        lightboxImg.addEventListener("load", () => {
          lightboxImg.classList.add("is-ready");
        });

        lightboxImg.addEventListener("error", () => {
          lightboxImg.classList.add("is-ready");
        });

        lightbox.addEventListener("click", (e) => {
          if (e.target.closest("[data-close]")) {
            closePhoto();
          }
        });

        lightboxPrev.addEventListener("click", showPrev);
        lightboxNext.addEventListener("click", showNext);
      }

      function openPhoto(index) {
        if (!photos.length) return;

        currentPhotoIndex =
          ((index % photos.length) + photos.length) % photos.length;

        renderLightbox();

        lightbox.classList.add("is-open");
        lightbox.setAttribute("aria-hidden", "false");

        lightboxOpen = true;

        stopInertia();

        const showNav = photos.length > 1;

        lightboxPrev.hidden = !showNav;
        lightboxNext.hidden = !showNav;
      }

      function closePhoto() {
        lightboxOpen = false;

        lightbox.classList.remove("is-open");
        lightbox.setAttribute("aria-hidden", "true");
      }

      function showPrev() {
        openPhoto(currentPhotoIndex - 1);
      }

      function showNext() {
        openPhoto(currentPhotoIndex + 1);
      }

      function renderLightbox() {
        const photo = photos[currentPhotoIndex];

        if (!photo) return;

        lightboxImg.classList.remove("is-ready");

        lightboxImg.alt = photo.title || "旅行照片";
        lightboxImg.src = photo.src;

        requestAnimationFrame(() => {
          if (lightboxImg.complete && lightboxImg.naturalWidth > 0) {
            lightboxImg.classList.add("is-ready");
          }
        });

        lightboxTitle.textContent = photo.title || "旅行照片";

        lightboxLocation.textContent = photo.location || "";
        lightboxLocation.hidden = !photo.location;

        lightboxDate.textContent = photo.date || "";
        lightboxDate.hidden = !photo.date;

        lightboxStory.textContent = photo.story || "";
        lightboxStory.hidden = !photo.story;

        lightboxCount.textContent = `${currentPhotoIndex + 1} / ${photos.length}`;

        preloadAdjacent(currentPhotoIndex);
      }

      function preloadAdjacent(index) {
        if (photos.length <= 1) return;

        const prevIndex = ((index - 1) + photos.length) % photos.length;
        const nextIndex = ((index + 1) + photos.length) % photos.length;

        const prevImg = new Image();
        prevImg.src = photos[prevIndex].src;

        const nextImg = new Image();
        nextImg.src = photos[nextIndex].src;
      }

      function onResize() {
        metrics = computeMetrics();

        tiles.forEach((tile) => tile.remove());
        tiles.clear();

        render();
      }
    })();
  </script>
</body>
</html>

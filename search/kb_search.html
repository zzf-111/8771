<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>统一知识库检索 · 翁恺C语言 + 宋浩数学</title>
<style>
  :root{
    --bg:#f5f7fa; --panel:#ffffff; --ink:#1f2329; --sub:#5e6470;
    --red:#d33a3a; --line:#e3e8ef; --accent:#2f6df0;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
       background:var(--bg);color:var(--ink);padding:24px;}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:var(--sub);font-size:13px;margin-bottom:18px}
  .bar{display:flex;gap:10px;margin-bottom:18px}
  input{flex:1;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:#fff}
  button{padding:12px 20px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-size:15px;cursor:pointer}
  button:disabled{opacity:.5;cursor:default}
  .stat{font-size:13px;color:var(--sub);margin-bottom:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
  .tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:6px;color:#fff;margin-right:8px}
  .tag.c1{background:#d33a3a}.tag.c2{background:#2f6df0}.tag.c3{background:#16a085}
  .meta{color:var(--sub);font-size:12px;margin-bottom:6px}
  .text{font-size:14px;line-height:1.7}
  .hl{background:#fff3a0;padding:0 2px;border-radius:3px}
  .empty{color:var(--sub);padding:30px;text-align:center}
  a{color:var(--accent);text-decoration:none}
</style>
</head>
<body>
  <h1>统一知识库检索</h1>
  <div class="sub">数据源：翁恺《C语言程序设计》+ 宋浩数学（线性代数 / 高等数学）。输入一句话，召回最相关片段。</div>
  <div class="bar">
    <input id="q" placeholder="例如：指针和数组的区别 / 行列式怎么算 / 导数定义">
    <button id="go">检索</button>
  </div>
  <div class="stat" id="stat">加载中…</div>
  <div id="results"></div>

<script>
const STOP = new Set("的 了 是 在 和 与 及 也 都 就 而 你 我 他 她 它 这 那 这个 那个 我们 你们 他们 一个 可以 什么 怎么 如何 因为 所以 但是 如果 而且 一种 这样 那样 这些 那些 比如 例如 就是 不是 没有 有 啊 呢 吧 吗 哦 啦 嘛 的 地 得".split(" "));
function tok(t){t=t.replace(/\s+/g," ");const out=[];let cur="";for(const ch of t){if(/[\u4e00-\u9fff]/.test(ch)){cur+=ch;if(cur.length===2){out.push(cur);cur="";}}else{cur="";}}if(cur.length===2)out.push(cur);return out.length?out:[t];}
let DATA=null;
async function load(){
  const r=await fetch("../db/kb_data.json");
  DATA=await r.json();
  document.getElementById("stat").textContent=`已加载 ${DATA.chunks.length} 个片段，词表 ${Object.keys(DATA.vocab).length}`;
}
function queryVec(q){
  const toks=tok(q);const v=new Array(Object.keys(DATA.vocab).length).fill(0);
  const cnt={};for(const w of toks){cnt[w]=(cnt[w]||0)+1;}
  let norm=0;
  for(const w in cnt){if(w in DATA.vocab){const i=DATA.vocab[w];const val=cnt[w];v[i]=val;norm+=val*val;}}
  norm=Math.sqrt(norm)||1;
  for(let i=0;i<v.length;i++)v[i]/=norm;
  return v;
}
function search(q,k=8){
  const qv=queryVec(q);const M=DATA.matrix;const scores=[];
  for(let i=0;i<M.length;i++){
    let dot=0;for(let j=0;j<qv.length;j++){if(qv[j])dot+=qv[j]*M[i][j];}
    if(dot>0)scores.push([dot,i]);
  }
  scores.sort((a,b)=>b[0]-a[0]);
  return scores.slice(0,k);
}
function hl(text,q){
  const ks=tok(q).filter(w=>w.length>1);
  let t=text;
  for(const k of ks){t=t.split(k).join('<span class="hl">'+k+'</span>');}
  return t;
}
function render(q){
  if(!DATA){return;}
  const res=search(q);
  const box=document.getElementById("results");
  if(!res.length){box.innerHTML='<div class="empty">未找到相关片段，换个说法试试。</div>';return;}
  let html="";
  res.forEach(([score,i])=>{
    const c=DATA.chunks[i];
    const src=c.source==="翁恺C语言"?"c1":(c.source.includes("数学")?"c2":"c3");
    const loc=c.ts?`<span>⏱ ${fmtTs(c.ts)}</span>`:(c.course?`<span>📚 ${c.course}</span>`:"");
    const ep=c.episode?` · ${c.episode}`:"";
    html+=`<div class="card"><div class="meta"><span class="tag ${src}">${c.source}</span>${ep} ${loc} · 相关度 ${score.toFixed(3)}</div><div class="text">${hl(c.text,q)}</div></div>`;
  });
  box.innerHTML=html;
}
function fmtTs(s){const m=Math.floor(s/60);const sec=Math.floor(s%60);return `${m}:${String(sec).padStart(2,'0')}`;}
document.getElementById("go").onclick=()=>{const q=document.getElementById("q").value.trim();if(q)render(q);};
document.getElementById("q").addEventListener("keydown",e=>{if(e.key==="Enter"){const q=e.target.value.trim();if(q)render(q);}});
load();
</script>
</body>
</html>
